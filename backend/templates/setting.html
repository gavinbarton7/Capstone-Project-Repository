<!DOCTYPE html>
<html>
<head><title>Setting</title></head>
<body>
  <nav> <a href="/profile">Profile</a> | <a href="/setting">Setting</a></nav>
  <nav><a href="/dashboard">Dashboard</a> | <a href="/budget">Budget</a> | <a href="/expenses">Expenses</a> | <a href="/logout">Log out</a></nav>
  <h1>Settings</h1>
  <p>Manage preferences and alerts for your workspace.</p>
  <!-- Tabs "Notification" and "Connected bank" are not built yet -->

  <h2>Preferences</h2>
  <p>Manage how dates and other information appear across Money.</p>

  <!-- The choices come from the backend (settings.options), and the saved value is pre-selected.
       Each dropdown saves by itself as soon as it changes. -->
  <label>Language
    <select name="language">
      {% for o in settings.options.languages %}
        <option value="{{ o.value }}" {% if o.value == settings.language %}selected{% endif %}>{{ o.label }}</option>
      {% endfor %}
    </select>
  </label>

  <label>Date format
    <select name="date_format">
      {% for o in settings.options.date_formats %}
        <option value="{{ o.value }}" {% if o.value == settings.date_format %}selected{% endif %}>{{ o.label }}</option>
      {% endfor %}
    </select>
  </label>

  <label>Week starts on
    <select name="week_start">
      {% for o in settings.options.week_starts %}
        <option value="{{ o.value }}" {% if o.value == settings.week_start %}selected{% endif %}>{{ o.label }}</option>
      {% endfor %}
    </select>
  </label>
  <p id="message"></p>

  <!-- Account email: saves through PUT /api/profile (the same endpoint the Profile page uses).
       The new email is written to the database right away and is what they sign in with next time. -->
  <h2>Account email</h2>
  <form id="email-form">
    <label>Email <input type="email" name="email" value="{{ user.email }}" required></label>
    <button type="submit">Update email</button>
  </form>
  <p id="email-message"></p>

  <h3>Log out</h3>
  <p>Sign out of your Money account on this device.</p>
  <a href="/logout">Log out</a>

  <script>
    const message = document.getElementById("message");

    async function save(name, value) {
      const res = await fetch("/api/settings", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ [name]: value }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        message.textContent = data.error || "Could not save.";
        return;
      }
      message.textContent = "Saved.";
      // A new date format changes every date on every page, so reload to show it.
      // (Language and week start are only saved for now, nothing changes yet.)
      if (name === "date_format") location.reload();
    }

    document.querySelectorAll("select").forEach(sel =>
      sel.addEventListener("change", () => save(sel.name, sel.value))
    );

    // Account email form
    const emailForm = document.getElementById("email-form");
    const emailMessage = document.getElementById("email-message");
    emailForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const res = await fetch("/api/profile", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: emailForm.elements.email.value }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        emailMessage.textContent = data.error || "Could not update the email.";
        return;
      }
      emailForm.elements.email.value = data.user.email;   // shown the way it was saved (lowercase)
      emailMessage.textContent = "Email updated. Use it the next time you sign in.";
    });
  </script>
</body>
</html>

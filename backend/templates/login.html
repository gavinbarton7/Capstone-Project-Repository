<!DOCTYPE html>
<html>
<head><title>Login</title></head>
<body>
  <h1>Login</h1>

  {% if message %}
    <p style="color: #1b7a2b;">{{ message }}</p>
  {% endif %}

  {% if error %}
    <p style="color: #b00020;">{{ error }}</p>
  {% endif %}

  <form action="/login" method="POST">
    <input type="email" name="email" placeholder="Email" value="{{ form.email if form }}" required>
    <input type="password" name="password" placeholder="Password" required>
    <label><input type="checkbox" name="remember_me"> Keep me signed in on this device</label>
    <button type="submit">Login</button>
  </form>

  <p>No account yet? <a href="/">Sign up</a></p>
</body>
</html>
